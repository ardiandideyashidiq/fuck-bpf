repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-merge-conflict

- repo: local
  hooks:
  - id: patch-mbox-footer
    name: patch mbox footer check
    entry: python3 scripts/patch_checks.py mbox-footer
    language: system
    files: '\.patch$'

  - id: patch-creates-patch
    name: detect patches that create other patches
    entry: python3 scripts/patch_checks.py no-patch-in-diff
    language: system
    files: '\.patch$'

  - id: patch-numbering-order
    name: check patch numbering order per directory
    entry: python3 scripts/patch_checks.py numbering-order
    language: system
    files: '\.patch$'

  - id: patch-synced-source-apply
    name: validate patches against synced source tree
    entry: bash
    args:
    - -c
    - |
      if [ $# -eq 0 ]; then
        exit 0
      fi
      if [ -z "${FUCK_BPF_SOURCE_ROOT:-}" ]; then
        echo "[SKIPPED] set FUCK_BPF_SOURCE_ROOT to validate patch replay against a synced source tree"
        exit 0
      fi
      python3 ./scripts/validate.py "$FUCK_BPF_SOURCE_ROOT"
    language: system
    files: '\.patch$'
