[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuck-bpf"
version = "1.0.0"
description = "BPF patch series manager for Android AOSP trees"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.scripts]
fuck-bpf = "scripts.rich_cli:run"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["scripts"]
py-modules = ["apply"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
